<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title></title>Join WhatsApp Group</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>

    <form id="wa-form">
        <!-- Your Site Key is here -->
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAFMLEPy5oa3unrnF"></div>
        <button type="submit">Join Group,</button>
    </form>

    <script>
        document.getElementById('wa-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            // Replace with your Cloudflare Worker URL
            const workerUrl = 'https://your-worker-name.your-subdomain.workers.dev';
            
            try {
                const res = await fetch(workerUrl, { method: 'POST', body: formData });
                if (res.ok) {
                    const data = await res.json();
                    window.location.href = data.url; 
                } else {
                    alert('Verification failed. Are you a bot?');
                }
            } catch (error) {
                console.error('Error connecting to verification server.');
            }
        });
    </script>
</body>
</html>
